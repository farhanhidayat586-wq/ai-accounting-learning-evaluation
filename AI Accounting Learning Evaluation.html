<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>AI Accounting Learning Evaluation</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF2F1;--card:#fff;--ink:#12262A;--mute:#5A6F73;--line:#D3DEDC;--brand:#0E6A63;--soft:#E1F0ED;--warn:#B7791F;--bad:#B4432F;--good:#2F7D4F;--onb:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1A1C;--card:#16262A;--ink:#E5EFEE;--mute:#92AAA9;--line:#26393C;--brand:#4DB8AC;--soft:#173A38;--warn:#E0A94A;--bad:#E27B67;--good:#6CC48D;--onb:#0F1A1C}}
:root[data-theme="dark"]{--bg:#0F1A1C;--card:#16262A;--ink:#E5EFEE;--mute:#92AAA9;--line:#26393C;--brand:#4DB8AC;--soft:#173A38;--warn:#E0A94A;--bad:#E27B67;--good:#6CC48D;--onb:#0F1A1C}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:"Bricolage Grotesque","IBM Plex Sans",system-ui,sans-serif;line-height:1.15;margin:0 0 .4em}
h1{font-size:clamp(1.9rem,5vw,3rem);letter-spacing:-.02em}h2{font-size:1.35rem}h3{font-size:1.05rem}
p{margin:.3em 0}.mu{color:var(--mute)}small{color:var(--mute)}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}
header.top{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.hd{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 0;flex-wrap:wrap}
.brand b{font:700 1.1rem "Bricolage Grotesque",sans-serif;display:inline-block;border-bottom:4px double var(--brand);padding-bottom:1px}
.brand span{display:block;font-size:.78rem;color:var(--mute)}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:none;color:var(--ink);padding:7px 14px;cursor:pointer;font:inherit}
.seg button.on{background:var(--brand);color:var(--onb)}

main{padding:22px 0 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:16px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.g2{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.row{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.stat b{display:block;font:700 1.9rem "Bricolage Grotesque",sans-serif}
.stat span{color:var(--mute);font-size:.88rem}
.tot{display:inline-block;border-bottom:5px double var(--ink);padding:0 4px}

.btn.sec{background:none;color:var(--brand)}.btn.sm{padding:5px 10px;font-size:.84rem}.btn.dng{background:none;color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--warn);outline-offset:1px}
.bdg{display:inline-block;font-size:.76rem;padding:2px 8px;border-radius:99px;background:var(--soft);color:var(--brand);margin:0 4px 4px 0;font-weight:500}
.bdg.w{background:none;border:1px solid var(--warn);color:var(--warn)}.bdg.b{background:none;border:1px solid var(--bad);color:var(--bad)}.bdg.g{background:none;border:1px solid var(--good);color:var(--good)}
.br{margin:9px 0}.brl{display:flex;justify-content:space-between;font-size:.9rem}
.bt{height:8px;background:var(--line);border-radius:9px;overflow:hidden}.bt i{display:block;height:100%;background:var(--brand)}
.bt i.g{background:var(--good)}.bt i.w{background:var(--warn)}.bt i.b{background:var(--bad)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:8px 10px;width:100%}
textarea{min-height:150px;resize:vertical}label.f{display:block;font-weight:500;font-size:.88rem;margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips label{display:flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:7px;padding:5px 9px;font-size:.86rem;cursor:pointer;background:var(--bg)}
.chips input{width:auto}
.tbl{width:100%;border-collapse:collapse;font-size:.92rem}.tbl th,.tbl td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.sc{overflow-x:auto}
.hero{display:grid;gap:22px;grid-template-columns:1.3fr 1fr;align-items:center;margin-bottom:18px}
@media(max-width:760px){.hero{grid-template-columns:1fr}}
.jr{font-family:"IBM Plex Sans",monospace;font-size:.92rem}.jr td{padding:5px 8px}.jr .k{padding-left:28px}.jr td:nth-child(n+2){text-align:right}
.q{border:1px solid var(--line);border-radius:9px;padding:12px;margin-bottom:10px}
.key{background:var(--soft);border-radius:7px;padding:8px 10px;font-size:.88rem;margin-top:6px}
.ex{display:grid;gap:16px;grid-template-columns:1fr 230px;align-items:start}@media(max-width:760px){.ex{grid-template-columns:1fr}}
.op{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:10px;margin:8px 0;cursor:pointer}
.op.sel{border-color:var(--brand);background:var(--soft)}.op input{width:auto;margin-top:4px}
.qnv{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px}
.qn{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;padding:7px 0;cursor:pointer;font:inherit}
.qn.has{background:var(--soft);border-color:var(--brand)}.qn.cur{background:var(--brand);color:var(--onb)}
.tm{font:700 1.4rem "Bricolage Grotesque",sans-serif}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.md{background:var(--card);border-radius:12px;padding:20px;max-width:560px;width:100%;max-height:85vh;overflow:auto}
.rv{border-left:4px solid var(--line);padding:6px 12px;margin:12px 0}.rv.ok{border-color:var(--good)}.rv.pt{border-color:var(--warn)}.rv.no{border-color:var(--bad)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:30;max-width:90%}
.note{border:1px dashed var(--warn);border-radius:8px;padding:10px 12px;font-size:.88rem;background:none}
@media(prefers-reduced-motion:no-preference){.bt i{transition:width .4s}}
</style>

<script>
let R=Math.random;
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ri=(a,b)=>a+Math.floor(R()*(b-a+1)),pick=a=>a[Math.floor(R()*a.length)];
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const amt=(a,b,s=50000)=>ri(a/s,b/s)*s,rp=n=>'Rp'+Math.round(n).toLocaleString('id-ID'),avg=a=>a.reduce((x,y)=>x+y,0)/(a.length||1);
const clamp=v=>Math.max(0,Math.min(1,v)),f1=n=>(Math.round(n*10)/10).toString().replace('.',',');
let uid=0;const nid=()=>'q'+Date.now().toString(36)+(uid++)+Math.floor(R()*1e5).toString(36);
const BL=['Mengingat','Memahami','Menerapkan','Menganalisis','Mengevaluasi','Menciptakan'],VB=['menyebutkan','menjelaskan','menerapkan','menganalisis','mengevaluasi','merancang'],DF=['Campuran','Mudah','Sedang','Sulit'];
const TY={pg:'Pilihan ganda',bs:'Benar/Salah',isian:'Isian singkat',jurnal:'Jurnal umum',analisis:'Analisis transaksi',kasus:'Studi kasus',profesional:'Kasus profesional',esai:'Esai analitis'};
const PTS={pg:1,bs:1,isian:2,jurnal:4,analisis:2,kasus:10,profesional:2,esai:8};
const MAT=[
['persamaan','Persamaan dasar akuntansi',[['Aset','sumber daya yang dikuasai entitas dan diharapkan memberi manfaat ekonomi di masa depan'],['Liabilitas','kewajiban kini entitas yang timbul dari peristiwa masa lalu'],['Ekuitas','hak residual atas aset setelah dikurangi seluruh liabilitas']]],
['siklus','Siklus akuntansi',[['Jurnal penutup','jurnal untuk menutup akun nominal ke ikhtisar laba rugi dan modal'],['Bukti transaksi','dokumen sumber yang menjadi dasar pencatatan transaksi'],['Neraca saldo setelah penyesuaian','daftar saldo akun yang telah memuat jurnal penyesuaian']]],
['jurnal','Jurnal umum',[['Debit','sisi kiri akun yang menambah aset dan beban'],['Kredit','sisi kanan akun yang menambah liabilitas, ekuitas, dan pendapatan'],['Jurnal umum','catatan kronologis pertama atas transaksi dalam bentuk debit dan kredit']]],
['penyesuaian','Jurnal penyesuaian',[['Beban dibayar di muka','pengeluaran kas untuk beban periode mendatang yang dicatat sebagai aset'],['Pendapatan diterima di muka','kas yang diterima atas jasa yang belum diberikan dan dicatat sebagai liabilitas'],['Beban akrual','beban yang sudah terjadi tetapi belum dibayar dan belum dicatat']]],
['bukubesar','Buku besar',[['Buku besar','kumpulan seluruh akun yang menunjukkan saldo setiap akun'],['Posting','pemindahan angka dari jurnal ke akun buku besar'],['Akun T','bentuk sederhana akun dengan sisi debit dan sisi kredit']]],
['neraca','Neraca saldo',[['Neraca saldo','daftar saldo akun buku besar untuk menguji keseimbangan total debit dan kredit'],['Kesalahan transposisi','kesalahan pertukaran urutan digit angka yang selisihnya habis dibagi sembilan'],['Saldo normal','sisi akun (debit atau kredit) tempat saldo biasanya berada']]],
['labarugi','Laporan laba rugi',[['Laba bersih','pendapatan dikurangi seluruh beban dalam satu periode'],['Beban','penurunan manfaat ekonomi periode berjalan dalam bentuk arus keluar aset atau kenaikan liabilitas'],['Pendapatan','kenaikan manfaat ekonomi periode berjalan yang menaikkan ekuitas di luar setoran pemilik']]],
['posisi','Laporan posisi keuangan',[['Laporan posisi keuangan','laporan yang menyajikan aset, liabilitas, dan ekuitas pada tanggal tertentu'],['Aset lancar','aset yang diharapkan terealisasi dalam satu siklus operasi atau dua belas bulan'],['Liabilitas jangka panjang','kewajiban yang jatuh tempo lebih dari dua belas bulan']]],
['aruskas','Laporan arus kas',[['Arus kas operasi','arus kas dari aktivitas utama penghasil pendapatan'],['Arus kas investasi','arus kas dari perolehan dan pelepasan aset jangka panjang'],['Arus kas pendanaan','arus kas dari perubahan modal dan pinjaman']]],
['jasa','Akuntansi perusahaan jasa',[['Perusahaan jasa','entitas yang pendapatannya berasal dari penyediaan jasa, bukan penjualan barang'],['Piutang usaha','hak tagih atas jasa yang sudah diserahkan tetapi belum dibayar pelanggan'],['Pendapatan jasa','pendapatan yang diakui saat jasa telah diserahkan kepada pelanggan']]],
['dagang','Akuntansi perusahaan dagang',[['Harga pokok penjualan','biaya perolehan barang yang terjual pada periode berjalan'],['Sistem periodik','sistem persediaan yang menentukan persediaan akhir melalui perhitungan fisik'],['Retur pembelian','pengembalian barang kepada pemasok yang mengurangi pembelian']]],
['biaya','Akuntansi biaya',[['Biaya tetap','biaya yang totalnya tidak berubah dalam rentang aktivitas relevan'],['Biaya variabel','biaya yang totalnya berubah proporsional dengan volume aktivitas'],['Biaya overhead pabrik','biaya produksi selain bahan baku langsung dan tenaga kerja langsung']]],
['manajemen','Akuntansi manajemen',[['Anggaran','rencana keuangan kuantitatif untuk periode mendatang'],['Titik impas','volume penjualan ketika laba sama dengan nol'],['Biaya relevan','biaya masa depan yang berbeda antar alternatif keputusan']]],
['keuangan','Akuntansi keuangan',[['Penyusutan','alokasi sistematis biaya perolehan aset tetap selama umur manfaatnya'],['Persediaan','aset yang dimiliki untuk dijual atau diproses dalam kegiatan usaha'],['Penurunan nilai','penyesuaian ketika jumlah terpulihkan aset lebih rendah dari jumlah tercatat']]],
['lapkeu','Analisis laporan keuangan',[['Rasio lancar','aset lancar dibagi liabilitas jangka pendek untuk menilai likuiditas'],['Rasio utang terhadap ekuitas','total liabilitas dibagi total ekuitas untuk menilai struktur pendanaan'],['Margin laba bersih','laba bersih dibagi pendapatan untuk menilai profitabilitas']]],
['etika','Etika profesi akuntansi',[['Integritas','prinsip bersikap jujur dan tegas dalam hubungan profesional'],['Objektivitas','prinsip tidak membiarkan bias atau benturan kepentingan memengaruhi pertimbangan profesional'],['Kerahasiaan','kewajiban tidak mengungkapkan informasi klien tanpa kewenangan']]],
['audit','Audit dasar',[['Bukti audit','informasi yang digunakan auditor untuk menarik kesimpulan sebagai dasar opini'],['Materialitas','besaran salah saji yang dapat memengaruhi keputusan pengguna laporan keuangan'],['Pengendalian internal','proses yang dirancang untuk memberi keyakinan memadai atas keandalan pelaporan dan kepatuhan']]],
['standar','Standar akuntansi',[['SAK','Standar Akuntansi Keuangan yang berlaku di Indonesia'],['Kesinambungan usaha','asumsi bahwa entitas akan beroperasi di masa depan yang dapat diperkirakan'],['Basis akrual','pengakuan transaksi saat terjadi, bukan saat kas diterima atau dibayar']]],
['teknologi','Akuntansi berbasis teknologi dan AI',[['Otomatisasi proses robotik','penggunaan perangkat lunak untuk mengerjakan tugas akuntansi repetitif secara otomatis'],['Analitik data','pemeriksaan data untuk menemukan pola dan anomali sebagai dasar keputusan'],['Komputasi awan','penyediaan layanan komputasi daring sehingga sistem akuntansi dapat diakses dari mana saja']]]];
const MN=Object.fromEntries(MAT.map(m=>[m[0],m[1]]));
const COA=['Kas','Piutang Usaha','Perlengkapan','Asuransi Dibayar di Muka','Peralatan','Akumulasi Penyusutan Peralatan','Utang Usaha','Utang Gaji','Pendapatan Diterima di Muka','Modal Pemilik','Pendapatan Jasa','Beban Gaji','Beban Sewa','Beban Perlengkapan','Beban Asuransi','Beban Penyusutan'];
const BIZ=['Kopi Senja','Laundry Bersih','Studio Rupa','Bengkel Maju','Toko Sinar','Klinik Sehat'];
/* ===== Bank generator soal (AI Question Generator berbasis templat) ===== */
const GEN=[],G=(type,m,bl,df,make)=>GEN.push({type,m,bl,df,make});
const mk=(type,m,bl,df,x)=>({id:nid(),type,m,bl,df,p:PTS[type],lo:`Mahasiswa mampu ${VB[bl]} ${x.c}.`,...x});
const mc=(type,m,bl,df,q,ok,bad,ex,c)=>mk(type,m,bl,df,{q,c,o:[ok,...bad],ans:0,ex});
const iq=(m,bl,df,q,v,ex,c,tol)=>mk('isian',m,bl,df,{q,c,num:v,tol:tol??.5,key:tol&&tol<1?String(v.toFixed(2)).replace('.',','):(q.includes('unit')?v+' unit':rp(v)),ex});
MAT.forEach(([k,n,f])=>{
 const oth=()=>MAT.flatMap(x=>x[2]).filter(x=>!f.includes(x));
 G('pg',[k],0,1,()=>{const [t,d]=pick(f);return mc('pg',k,0,1,`Pernyataan berikut merupakan pengertian dari: "${d}".`,t,shuf(f.filter(x=>x[0]!==t).concat(shuf(oth()).slice(0,3))).slice(0,3).map(x=>x[0]),`${t} adalah ${d}.`,t)});
 G('bs',[k],1,1,()=>{const [t,d]=pick(f),tr=R()<.5,o=pick(oth());return mk('bs',k,1,1,{q:`${t} adalah ${tr?d:o[1]}.`,c:t,o:['Benar','Salah'],ans:tr?0:1,ex:tr?`Pernyataan benar. ${t} adalah ${d}.`:`Pernyataan salah. ${t} adalah ${d}.`})});
 G('isian',[k],0,2,()=>{const [t,d]=pick(f);return mk('isian',k,0,2,{q:`Sebutkan istilah akuntansi untuk: ${d}.`,c:t,key:t,txt:t.toLowerCase(),ex:`${t} adalah ${d}.`})});
});
const JT=[['membeli perlengkapan secara tunai','Perlengkapan','Kas'],['menerima pendapatan jasa secara tunai','Kas','Pendapatan Jasa'],['membayar beban sewa secara tunai','Beban Sewa','Kas'],['membeli peralatan secara kredit','Peralatan','Utang Usaha'],['menerima setoran modal tunai dari pemilik','Kas','Modal Pemilik'],['memberikan jasa kepada pelanggan yang belum membayar','Piutang Usaha','Pendapatan Jasa'],['membayar utang usaha secara tunai','Utang Usaha','Kas']];
G('jurnal',['jurnal','jasa','siklus','bukubesar'],2,1,k=>{const [t,d,c]=pick(JT),a=amt(500000,5000000);return mk('jurnal',k,2,1,{q:`${pick(BIZ)} ${t} sebesar ${rp(a)}. Catatlah jurnal umum untuk transaksi tersebut.`,c:'pencatatan jurnal '+t,e:[{a:d,d:a},{a:c,k:a}],ex:`Debit ${d} ${rp(a)}; kredit ${c} ${rp(a)}.`})});
G('jurnal',['penyesuaian'],2,3,k=>{const v=ri(0,3),b=pick(BIZ);let q,e,c;
 if(v===0){const m=ri(1,5)*100000,n=ri(2,9);q=`${b} membayar premi asuransi 12 bulan sebesar ${rp(m*12)} yang dicatat sebagai Asuransi Dibayar di Muka. Pada akhir periode, ${n} bulan telah berlalu. Catatlah jurnal penyesuaian.`;e=[{a:'Beban Asuransi',d:m*n},{a:'Asuransi Dibayar di Muka',k:m*n}];c='penyesuaian beban dibayar di muka'}
 else if(v===1){const g=amt(1000000,6000000,100000);q=`Gaji karyawan ${b} sebesar ${rp(g)} telah menjadi beban pada akhir periode tetapi belum dibayar. Catatlah jurnal penyesuaian.`;e=[{a:'Beban Gaji',d:g},{a:'Utang Gaji',k:g}];c='penyesuaian beban akrual'}
 else if(v===2){const a=amt(2000000,6000000,100000),s=a-amt(500000,1500000,100000);q=`Perlengkapan ${b} pada awal periode ${rp(a)}. Hasil perhitungan fisik pada akhir periode menunjukkan perlengkapan tersisa ${rp(s)}. Catatlah jurnal penyesuaian.`;e=[{a:'Beban Perlengkapan',d:a-s},{a:'Perlengkapan',k:a-s}];c='penyesuaian pemakaian perlengkapan'}
 else{const m=ri(1,5)*100000,n=ri(2,5);q=`${b} menerima pembayaran di muka untuk jasa selama 6 bulan sebesar ${rp(m*6)} dan mencatatnya sebagai Pendapatan Diterima di Muka. Pada akhir periode, jasa untuk ${n} bulan telah diberikan. Catatlah jurnal penyesuaian.`;e=[{a:'Pendapatan Diterima di Muka',d:m*n},{a:'Pendapatan Jasa',k:m*n}];c='penyesuaian pendapatan diterima di muka'}
 return mk('jurnal',k,2,3,{q,c,e,ex:e.map(x=>`${x.d?'Debit':'Kredit'} ${x.a} ${rp(x.d||x.k)}`).join('; ')+'.'})});
G('isian',['persamaan'],2,1,k=>{const a=amt(50e6,200e6,5e6),l=amt(10e6,40e6,5e6);return iq(k,2,1,`Total aset ${pick(BIZ)} sebesar ${rp(a)} dan total liabilitas ${rp(l)}. Berapakah ekuitas pemilik? (jawab dalam angka rupiah)`,a-l,`Ekuitas = Aset − Liabilitas = ${rp(a)} − ${rp(l)} = ${rp(a-l)}.`,'persamaan dasar akuntansi')});
const EF=['Aset bertambah, liabilitas bertambah','Satu aset bertambah dan aset lain berkurang','Aset berkurang, ekuitas berkurang','Aset bertambah, ekuitas bertambah','Aset berkurang, liabilitas berkurang'];

const ansHTML=(q,a)=>{if(a===undefined||a===''||a===null)return'<i>(tidak dijawab)</i>';if(q.o)return esc(q.o[a]);if(Array.isArray(a))return esc(a.filter(r=>r.a).map(r=>`${r.a} — ${r.d?'D '+r.d:''}${r.k?'K '+r.k:''}`).join('; ')||'(kosong)');return esc(a)};
function rubHTML(r){return `<div class="key">${r.map(c=>`<p style="margin:3px 0"><b>${c.n} (${c.w}%)</b>: skor ${f1(c.f*c.w)}/${c.w}${c.hit.length?` — terpenuhi: ${esc(c.hit.join(', '))}`:''}${c.miss.length?` — belum muncul: ${esc(c.miss.join(', '))}`:''}</p>`).join('')}<small>Skor awal AI berdasarkan rubrik; dosen dapat meninjau dan mengoreksi.</small></div>`}
function detail(a){const T=S.role==='dosen',g=agg([a]),ok=a.score>=a.kkm,b=a.items.filter(i=>i.sc>=.99).length,pt=a.items.filter(i=>i.sc>0&&i.sc<.99).length,f=fb([a]),fl=flags(a),n=a.qs.length;
 return `<p><button class="btn sec sm" data-a="back">← Daftar hasil</button></p><div class="card"><div class="row"><div><h2>${esc(a.t)}</h2><p class="mu">${esc(a.u)} · ${fd(a.d)} · durasi ${Math.floor(a.dur/60)} mnt ${a.dur%60} dtk</p></div><div style="text-align:right"><div class="tm" style="font-size:2.6rem"><span class="tot">${f1(a.score)}</span></div>${bd(ok?'Tuntas':'Belum tuntas',ok?'g':'b')}</div></div><p>${bd(b+' benar','g')}${bd(pt+' sebagian','w')}${bd((n-b-pt)+' salah','b')}${bd(Math.round(b/n*100)+'% jawaban benar')}${bd('KKM '+a.kkm)}</p>${S.role==='mhs'&&a.u===S.sname?`<button class="btn" data-a="redo" data-id="${a.ev}">Ulangi Latihan</button>`:''}</div>
 <div class="g2"><div class="card"><h3>Kompetensi per materi</h3>${Object.entries(g.mat).map(([k,v])=>bar(MN[k],v)).join('')}</div><div class="card"><h3>Tingkat kognitif</h3>${Object.entries(g.bl).sort((x,y)=>x[0]-y[0]).map(([k,v])=>bar(BL[k]+(v>=70?' · dikuasai':''),v)).join('')}</div></div>
 <div class="card"><h3>Umpan balik AI</h3><p><b>Sudah dikuasai:</b> ${f.kuat.map(k=>MN[k]).join(', ')||'belum ada materi dengan penguasaan ≥ 75%'}</p><p><b>Belum dikuasai:</b> ${f.lemah.map(k=>MN[k]).join(', ')||'tidak ada'}</p>${f.err.jurnal.size?`<p><b>Kesalahan pencatatan jurnal:</b> ${[...f.err.jurnal].slice(0,5).map(esc).join('; ')}.</p>`:''}${f.err.hitung?`<p><b>Kesalahan perhitungan:</b> ${f.err.hitung} soal hasil hitungnya belum tepat.</p>`:''}${f.err.analisis?`<p><b>Kesalahan analisis:</b> ${f.err.analisis} soal analisis/argumentasi belum memadai.</p>`:''}<p><b>Rekomendasi:</b> ${esc(rekText([a],T?'Mahasiswa':'Anda'))}</p><p class="mu"><small>Umpan balik berdasarkan skor per soal dan rubrik; bukan keputusan akademik final.</small></p></div>
 ${T?`<div class="card"><h3>Indikator untuk ditinjau dosen</h3>${fl.length?fl.map(x=>`<p>• ${esc(x)}</p>`).join('')+'<p class="note">Indikator ini hanya petunjuk untuk ditinjau. Sistem tidak menyimpulkan adanya kecurangan.</p>':'<p class="mu">Tidak ada pola yang perlu ditinjau.</p>'}</div>`:''}
 <div class="card"><h3>Pembahasan soal</h3>${a.qs.map((q,i)=>{const it=a.items[i],c=it.sc>=.99?'ok':it.sc>0?'pt':'no';return `<div class="rv ${c}"><div>${qBd(q)} <b>${f1(it.sc*q.p)}/${q.p}</b></div><p><b>${i+1}.</b> ${esc(q.q)}</p><p><span class="mu">Jawaban:</span> ${ansHTML(q,it.ans)}</p><p><span class="mu">Kunci:</span> ${esc(q.rub?q.key:keyText(q))}</p>${it.notes.length?`<p class="mu">Catatan: ${it.notes.map(esc).join('; ')}</p>`:''}${it.rub?rubHTML(it.rub):''}<p>${esc(q.ex||'')}</p></div>`}).join('')}</div>`}
function hasil(){const T=S.role==='dosen';if(S.det){const a=DB.atts.find(x=>x.id===S.det);if(a)return detail(a)}
 const A=flt(scope()).sort((a,b)=>b.d-a.d);return `<div class="row"><h2>Hasil evaluasi</h2>${evSel()}</div><div class="card sc"><table class="tbl"><tr>${T?'<th>Mahasiswa</th>':''}<th>Evaluasi</th><th>Tanggal</th><th>Nilai</th><th>Status</th>${T?'<th>Tinjauan</th>':''}<th></th></tr>${A.map(a=>`<tr>${T?`<td>${esc(a.u)}</td>`:''}<td>${esc(a.t)}</td><td>${fd(a.d)}</td><td><b>${Math.round(a.score)}</b></td><td>${bd(a.score>=a.kkm?'Tuntas':'Belum tuntas',a.score>=a.kkm?'g':'b')}</td>${T?`<td>${flags(a).length?bd(flags(a).length+' indikator','w'):'–'}</td>`:''}<td><button class="btn sec sm" data-a="det" data-id="${a.id}">Lihat</button></td></tr>`).join('')||'<tr><td colspan="7" class="mu">Belum ada hasil. Kerjakan evaluasi terlebih dahulu.</td></tr>'}</table></div>`}
function analitik(){const A=flt(scope()),g=agg(A),T=S.role==='dosen',DL=['0–39','40–54','55–69','70–84','85–100'],mx=Math.max(1,...g.dist);let P;
 if(T){const w={};A.forEach(a=>{const k=Math.floor(a.d/6048e5);(w[k]=w[k]||[]).push(a.score)});P=Object.keys(w).sort().map(k=>({v:avg(w[k]),l:fd(k*6048e5)}))}else P=A.slice().sort((a,b)=>a.d-b.d).map(a=>({v:a.score,l:fd(a.d)}));
 return `<div class="row"><h2>Analitik hasil belajar</h2>${evSel()}</div><div class="grid" style="margin-bottom:16px"><div class="card stat"><b>${Math.round(g.avg)}</b><span>Rata-rata nilai</span></div><div class="card stat"><b>${Math.round(g.max)}</b><span>Nilai tertinggi</span></div><div class="card stat"><b>${Math.round(g.min)}</b><span>Nilai terendah</span></div><div class="card stat"><b>${Math.round(g.pass)}%</b><span>Ketuntasan</span></div></div>
 <div class="g2"><div class="card"><h3>Distribusi nilai</h3>${DL.map((l,i)=>`<div class="br"><div class="brl"><span>${l}</span><b>${g.dist[i]}</b></div><div class="bt"><i style="width:${g.dist[i]/mx*100}%"></i></div></div>`).join('')}</div><div class="card"><h3>Perkembangan nilai</h3>${line(P)}</div>
 <div class="card"><h3>Penguasaan per materi</h3>${Object.entries(g.mat).sort((a,b)=>a[1]-b[1]).map(([k,v])=>bar(MN[k],v)).join('')||'<p class="mu">Belum ada data.</p>'}</div><div class="card"><h3>Penguasaan per tingkat kognitif</h3>${Object.entries(g.bl).sort((a,b)=>a[0]-b[0]).map(([k,v])=>bar(BL[k],v)).join('')||'<p class="mu">Belum ada data.</p>'}</div></div>
 <div class="card sc"><h3>Soal dengan tingkat kesalahan tertinggi</h3><table class="tbl"><tr><th>Soal</th><th>Materi</th><th>Bloom</th><th>Salah</th></tr>${g.hard.map(h=>`<tr><td>${esc(h.q.q.slice(0,110))}${h.q.q.length>110?'…':''}</td><td>${MN[h.q.m]}</td><td>${BL[h.q.bl]}</td><td><b>${Math.round(h.err)}%</b></td></tr>`).join('')||'<tr><td colspan="4" class="mu">Butuh minimal dua pengerjaan pada soal yang sama.</td></tr>'}</table></div>`}
function rek(){const T=S.role==='dosen',A=scope();if(!A.length)return `<h2>Rekomendasi AI</h2><div class="card"><p class="mu">Rekomendasi muncul setelah ada hasil evaluasi.</p></div>`;
 const g=agg(A),f=fb(A);let body;
 if(T){const last={};A.slice().sort((a,b)=>a.d-b.d).forEach(a=>last[a.u+a.ev]=a);const L=Object.values(last),bel=L.filter(a=>a.score<a.kkm).length,fl=A.filter(a=>flags(a).length).length,lw=Object.entries(g.bl).sort((a,b)=>a[1]-b[1])[0];
  body=`<div class="card"><h3>Rekomendasi intervensi pembelajaran</h3><p>${esc(rekText(A,'Kelas'))}</p></div><div class="card"><h3>Dasar data</h3><p>• ${bel} dari ${L.length} pengerjaan terakhir belum mencapai KKM (ketuntasan ${Math.round(g.pass)}%).</p>${Object.entries(g.mat).sort((a,b)=>a[1]-b[1]).slice(0,3).map(([k,v])=>`<p>• Materi dengan penguasaan terendah: ${MN[k]} (${Math.round(v)}%) — pertimbangkan sesi klarifikasi dan latihan tambahan.</p>`).join('')}${g.hard.slice(0,3).map(h=>`<p>• Soal tersulit (${Math.round(h.err)}% salah): ${esc(h.q.q.slice(0,90))}… — periksa kejelasan soal dan kembali ke konsep "${esc(h.q.c)}".</p>`).join('')}<p>• Tingkat kognitif terendah: ${BL[lw[0]]} (${Math.round(lw[1])}%) — tambah latihan bertahap pada level ini.</p>${fl?`<p>• ${fl} pengerjaan memiliki indikator untuk ditinjau (lihat tab Hasil).</p>`:''}</div>`}
 else body=`<div class="card"><h3>Rekomendasi untuk Anda</h3><p>${esc(rekText(A,'Anda'))}</p></div><div class="card"><h3>Materi yang perlu dipelajari kembali</h3>${Object.entries(g.mat).sort((a,b)=>a[1]-b[1]).slice(0,4).map(([k,v])=>bar(MN[k],v)).join('')}</div>`;
 return `<h2>Rekomendasi AI</h2>${body}<p class="note">AI berperan sebagai asisten evaluasi. Rekomendasi disusun dari data hasil evaluasi, dapat dijelaskan, dan bukan keputusan akademik final; dosen dapat meninjau dan mengoreksinya.</p>`}
function profil(){const T=S.role==='dosen';return `<h2>Profil</h2><div class="card"><div class="g2"><label class="f">Peran<input value="${T?'Dosen':'Mahasiswa'}" disabled></label>${T?'<label class="f">Nama<input value="Dr. Rina Kusuma" disabled></label>':`<label class="f">Nama mahasiswa<select data-sel="sname">${NM.map(n=>`<option ${n===S.sname?'selected':''}>${n}</option>`).join('')}</select></label>`}</div><p class="mu">Mode demo: peran dipilih lewat tombol di bagian atas. Pada versi produksi, login dan hak akses ditangani server.</p></div>
 <div class="card"><h3>Prinsip AI dan penilaian</h3><p>• Pilihan ganda dan benar/salah: 1 poin. Isian: 2 poin (kecocokan jawaban). Jurnal: 4 poin, dinilai per akun, posisi debit/kredit, dan nominal. Esai: 8 poin. Studi kasus: 10 poin.</p><p>• Studi kasus: pemahaman masalah 20%, ketepatan konsep 25%, ketepatan perhitungan 25%, kemampuan analisis 20%, kesimpulan dan argumentasi 10%. Esai: konsep 30%, argumentasi 25%, analisis 25%, kesimpulan 20%.</p><p>• Soal diacak, pilihan jawaban diacak, waktu dibatasi dan dicatat. Pola tidak wajar hanya menjadi indikator untuk ditinjau dosen.</p></div>
 <div class="card"><button class="btn dng" data-a="reset">Atur ulang data demo</button></div>`}
/* ===== Events ===== */
function act(a,d){const x=S.exam;
 switch(a){
 case'role':S.role=d.v;S.view='dash';S.det=null;break;
 case'nav':S.view=d.v;S.det=null;break;
 case'matgo':S.f.m=[d.k];S.view='evaluasi';break;
 case'open':S.open[d.k]=!S.open[d.k];break;
 case'gen':{const f=S.f;if(!f.m.length||!f.ty.length||!f.bl.length){note('Pilih minimal satu materi, tingkat kognitif, dan bentuk soal.');return}const qs=generate(f);if(!qs){note('Tidak ada templat soal untuk kombinasi ini. Longgarkan pilihan tingkat kognitif, kesulitan, atau bentuk soal.');return}if(qs.length<f.n)note(`Hanya ${qs.length} soal unik yang tersedia untuk kombinasi ini.`);S.d={...f,m:f.m.slice(),qs};break}
 case'swap':{const D=S.d,q=D.qs[+d.i];for(let t=0;t<15;t++){const n=generate({...D,ty:[q.type],m:[q.m],n:1});if(n&&n[0]&&n[0].q!==q.q){D.qs[+d.i]=n[0];break}}break}
 case'rm':S.d.qs.splice(+d.i,1);break;
 case'pub':{const e=mkEval(S.d,S.d.qs);DB.evals.push(e);S.d=null;note('Evaluasi diterbitkan dan tersedia untuk mahasiswa.');break}
 case'naskah':{const e=DB.evals.find(z=>z.id===d.id);modal(`<h3>Naskah soal dan kunci</h3><p class="mu">Salin teks di bawah untuk dicetak atau dibagikan.</p><textarea id="nk" readonly style="min-height:300px">${esc(naskah(e))}</textarea><p style="margin-top:12px"><button class="btn" data-a="copy">Salin teks</button> <button class="btn sec" data-a="closeM">Tutup</button></p>`);return}
 case'copy':{const t=$('#nk');t.select();try{navigator.clipboard.writeText(t.value).then(()=>note('Tersalin.'),()=>note('Teks terpilih; tekan Ctrl/Cmd+C untuk menyalin.'))}catch(e){note('Teks terpilih; tekan Ctrl/Cmd+C untuk menyalin.')}return}
 case'delev':DB.evals=DB.evals.filter(e=>e.id!==d.id);DB.atts=DB.atts.filter(z=>z.ev!==d.id);break;
 case'start':case'redo':startExam(DB.evals.find(e=>e.id===d.id));return;
 case'det':S.det=d.id;S.view='hasil';break;
 case'back':S.det=null;break;
 case'pick':x.ans[x.qs[x.i].id]=+d.i;break;
 case'go':lap();x.i=+d.i;break;
 case'prev':lap();x.i--;break;
 case'next':lap();x.i++;break;
 case'fin':{const un=x.qs.length-x.qs.filter(has).length;modal(`<h3>Akhiri evaluasi?</h3><p>Anda menjawab ${x.qs.length-un} dari ${x.qs.length} soal${un?`; <b>${un} soal belum dijawab</b>`:''}. Setelah diakhiri, jawaban tidak dapat diubah.</p><p><button class="btn sec" data-a="closeM">Kembali mengerjakan</button> <button class="btn" data-a="finish">Akhiri evaluasi</button></p>`);return}
 case'closeM':modal('');return;
 case'finish':finish();return;
 case'reset':DB=seed();S.d=null;S.det=null;break;
 }
 save();render()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b)act(b.dataset.a,b.dataset)});
function formIn(t){const k=t.dataset.f;if(t.type==='checkbox'){const v=k==='bl'?+t.dataset.v:t.dataset.v,ar=S.f[k],i=ar.indexOf(v);t.checked?(i<0&&ar.push(v)):(i>=0&&ar.splice(i,1))}else S.f[k]=t.type==='number'?+t.value:t.value}
['input','change'].forEach(ev=>document.addEventListener(ev,e=>{const t=e.target,x=S.exam;
 if(t.dataset.f!==undefined){formIn(t);return}
 if(ev==='change'&&t.dataset.sel){S[t.dataset.sel]=t.value;S.det=null;save();render();return}
 if(x&&t.dataset.ans!==undefined){x.ans[x.qs[x.i].id]=t.value;upd()}
 if(x&&t.dataset.r!==undefined){const q=x.qs[x.i],a=x.ans[q.id]||(x.ans[q.id]=[{},{},{},{}]);a[+t.dataset.r][t.dataset.k]=t.value;upd()}}));
document.addEventListener('visibilitychange',()=>{if(S.exam&&document.hidden)S.exam.tabs++});
render();
</script>
</body>
</html>
